name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.30.1 over the whole history
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --ignore-gitleaks-allow --max-archive-depth 3 --redact --verbose --exit-code 1 .

  # The build restores FFmpeg as the NuGet package Temno.FFmpeg.Runtime.win-x64. This job rebuilds it from source
  # and fails unless every file equals its pin in scripts/ffmpeg/Temno.FFmpeg.targets, the same pins the build
  # checks the package against. It does the same for Temno.FFmpeg.Runtime.linux-x64, the hosted services' build,
  # against scripts/ffmpeg/Temno.FFmpeg.linux-x64.targets.
  ffmpeg-from-source:
    name: Rebuild FFmpeg (${{ matrix.rid }}) from source and compare with the pins
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make room for the 9.4 GB build image
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - name: Build FFmpeg 9.1-temno1 in the digest-pinned image and compare every file
        shell: pwsh
        run: ./scripts/ffmpeg/build-ffmpeg.ps1 -Rid ${{ matrix.rid }} -OutDir artifacts/ffmpeg -Jobs 4
      - name: Keep the hashes
        if: always()
        run: |
          mkdir -p artifacts
          (cd artifacts/ffmpeg 2>/dev/null && find . -type f -exec sha256sum {} + | sort -k2 > ../ffmpeg-sha256.txt) || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ffmpeg-from-source-${{ matrix.rid }}-${{ github.sha }}
          path: artifacts/ffmpeg-sha256.txt
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build, test and package
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Release x64, run the Core tests, build an unsigned MSIX
        shell: pwsh
        run: ./scripts/ci-build.ps1 -OutputDirectory artifacts/ci -Environment production
      - name: Keep the logs, test results and package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: temno-ci-${{ github.sha }}
          path: |
            artifacts/ci/summary.json
            artifacts/ci/logs/
            artifacts/ci/test-results/
            artifacts/ci/msix/**/*.msix
          if-no-files-found: warn
          retention-days: 30
